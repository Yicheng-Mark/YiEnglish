# 生产 nginx 实配镜像（/etc/nginx/conf.d/lingoforge.conf，2026-09-17 与线上同步）
# 80 全部 301 到 https；443 服务前端静态 + /api 反代到 Express。
server {
    listen 80;
    server_name www.lingoforge.fun 47.115.147.221;
    return 301 https://www.lingoforge.fun$request_uri;
}

server {
    listen 443 ssl;
    server_name www.lingoforge.fun;

    ssl_certificate /www/ssl/www.lingoforge.fun.pem;
    ssl_certificate_key /www/ssl/www.lingoforge.fun.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端静态文件
    root /home/lingoforge/dist;
    index index.html;

    # 前端路由（SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Express
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加（$proxy_add_x_forwarded_for 会把客户端自带的伪造头拼在前面），
        # 防止伪造 X-Forwarded-For 绕过 Express 侧基于 req.ip 的限流。
        # 2026-09-17 修复：线上曾误用 $proxy_add_x_forwarded_for，配合 trust proxy=1
        # 可伪造 req.ip 绕过登录/注册/体验码的全部 IP 限流，已改回覆盖写法并黑盒验证。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
