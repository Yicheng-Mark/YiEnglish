name: Deploy to Aliyun
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 120.76.228.235
          username: root
          key: ${{ secrets.ALIYUN_KEY }}
          source: "."
          target: "/root/typing-word"
          strip_components: 1

      - name: Install deps and restart service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 120.76.228.235
          username: root
          key: ${{ secrets.ALIYUN_KEY }}
          script: |
            cd /root/typing-word
            npm install --production
            systemctl restart lingoforge
            echo "阿里云部署完成"
