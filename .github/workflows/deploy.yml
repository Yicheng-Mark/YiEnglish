name: Deploy to Aliyun
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Aliyun via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 120.76.228.235
          username: root
          key: ${{ secrets.ALIYUN_KEY }}
          script: |
            cd /root/typing-word
            git pull origin main
            npm install --production
            systemctl restart lingoforge
            echo "阿里云部署完成"
