name: Deploy to Aliyun
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH (rsync)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 120.76.228.235
          username: root
          key: ${{ secrets.ALIYUN_KEY }}
          script: |
            mkdir -p /root/typing-word

      - name: Rsync files to server
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.env.local' --exclude='node_modules' --exclude='.git'
          path: ./
          remote_path: /root/typing-word/
          remote_host: 120.76.228.235
          remote_user: root
          remote_key: ${{ secrets.ALIYUN_KEY }}

      - name: Install dependencies and restart
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 120.76.228.235
          username: root
          key: ${{ secrets.ALIYUN_KEY }}
          script: |
            cd /root/typing-word
            npm install --production
            systemctl restart lingoforge
            echo "阿里云部署完成"
