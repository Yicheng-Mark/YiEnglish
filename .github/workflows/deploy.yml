name: Deploy to Aliyun
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        # npm ci 按 lockfile 精确安装；--ignore-scripts 跳过 prepare(husky)，CI 不需要本地 git hooks
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ALIYUN_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 120.76.228.235 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync files to server
        run: |
          rsync -avz --delete \
            --exclude='.env.local' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='*.map' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ root@120.76.228.235:/home/lingoforge/

      - name: Install deps and restart service
        run: |
          ssh -i ~/.ssh/deploy_key root@120.76.228.235 'bash -s' << 'EOF'
            set -e
            cd /home/lingoforge
            npm install --omit=dev
            if pm2 describe lingoforge > /dev/null 2>&1; then
              pm2 restart lingoforge
            else
              pm2 start deploy/ecosystem.config.js
            fi
            pm2 save
            echo '阿里云部署完成'
          EOF
